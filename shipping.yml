- name: configuartion of shipping 
  hosts: shipping
  become: yes
  tasks:
  - name: install maven
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql
  
  - name: creating system user
    ansible.builtin.user:
      name: roboshop
      system: true
      state: present
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"
  
  - name: delete the app directory
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: creating the app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: delting the applications
    ansible.builtin.file:
      path: /tmp/shipping.zip
      state: absent
    
  - name: downloanding the application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
      dest: /tmp/shipping.zip
  
  - name: unzipping the application
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: install depencdensices
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: rename the files
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
    args:
      chdir: /app

  - name: copying the service files
    ansibile.builtin.template:
      src: shipping.service
      path: /etc/systemd/system/shipping.service
  
  - name: daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: install dependencie
    ansible.builtin.pip:
      name: "{{ item }}"
      executable: pip3.9
    loop:
    - cryptography
    - PyMySQL

  - name: import shipping data
    community.mysql.mysql_db:
      state: import
      name: all
      login_host: "{{ MYSQL_HOST }}"
      login_user: root
      login_password: RoboShop@1
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql

  - name: start and enable shipping
    ansible.builtin.service:
      name: shipping
      state: restarted
      enabled: yes
  
  