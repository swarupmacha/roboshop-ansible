- name: COnfiguration of catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: enabling node.js 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: installing nodejs 20
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: creating system user
    ansible.builtin.user:
      name: roboshop
      system: true
      state: present
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"
  
  - name: creating the app directory
    ansible.builtin.file:
      path: /app
      state: directory
    
  - name: downloanding the application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip
  
  - name: unzipping the application
    anisble.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  