- name: COnfiguration of catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: enabling node.js 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: installing nodejs 20
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: creating system user
    ansible.builtin.user:
      name: roboshop
      system: true
      state: present
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"
  
  - name: delete the app directory
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: creating the app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: delting the applications
    ansible.builtin.file:
      path: /tmp/catalogue.zip
      state: absent
    
  - name: downloanding the application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip
  
  - name: unzipping the application
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  
  - name: install depencies
    ansible.builtin.command: npm install
    args:
      chdir: /app

  - name: copying the catalogue repo
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
  
  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: isntaling mongodb 
    ansible.builtin.dnf:
      name: mongodb-org
      state: present
  
  - name: check products loaded
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output
  
  - name: pitning the catalogue_output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"
  
  - name: load the products
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout  | int < 0

  - name: start the catalogue
    ansible.builtin.service:
      name: catalogue
      state: present
      enabled: yes


  