- name: configuartion of mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: installtion mysql server
    ansible.builtin.dnf:
      name: mysql-server
      state: present
  
  - name: starting mysql server
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes
    
  - name: setup root passowrd
    ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1 