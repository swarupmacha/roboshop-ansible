- name: creating ec2 and route53 records
  hosts: all
  become: yes
  vars:
    sg_id: "sg-0fdf910f0d7d847cc"
    ami_id: "ami-0055977a6e828a4f4"
    domain_name: swarupmacha.online
    action: create
    env: dev
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: creating Ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }} - {{ env }}"
      tags:
        project: roboshop
        component: "{{ item }}"
        env: "{{ env}}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"
  
  - name: print the output 
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    when: action == "create"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" # mongodb-dev.daws88s.online, frontend-dev.daws88s.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
      wait: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"         # list

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{ env }}.{{ domain_name }}" # mongodb-dev.daws88s.online, frontend-dev.daws88s.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
      wait: true
    loop: "{{ ec2_output.results }}" # list
    when: #and
    - item.item == "frontend"
    - action == "create"

  - name: delete r53 records
    amazon.aws.route53:
      zone: "{{ domain_name }}"
      state: absent
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" # mongodb-dev.daws88s.online, frontend-dev.daws88s.online
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: action == "destroy"


  - name: deleting the instance
    amazon.aws.ec2_instance:
      state: absent
      name: "{{ item }} - {{ env }}"
      loop: "{{ instances }}"
    when: action == "destroy"


