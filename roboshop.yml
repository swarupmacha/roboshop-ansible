- name: creating ec2 and route53 records
  hosts: all
  become: yes
  vars:
    sg_id: "sg-0fdf910f0d7d847cc"
    ami_id: "ami-0055977a6e828a4f4"
    env: dev
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: creating Ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}"
      tags:
        project: roboshop
        component: "{{ item }}"
        env: "{{ env}}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
  
  - name: print the output 
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
