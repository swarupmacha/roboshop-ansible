- name: configuration of rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copying rabbitmq service
    ansibile.builtin.copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  
  - name: installing the rabbitmq
    ansibile.builtin.dnf:
      name: rabbitmq-server
      state: present
  
  - name: start the rabbitmq
    ansibile.builtin.dnf:
      name: rabbitmq-server
      state: started

  - name: create rabbitmq user
    community.rabbitmq.rabbitmq_user:
      user: roboshop 
      password: roboshop123
      permissions:
        - vhost: /
          configure_priv: .*
          read_priv: .*
          write_priv: .*
      state: present